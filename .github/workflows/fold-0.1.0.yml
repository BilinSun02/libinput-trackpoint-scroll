name: Fold 0.1.0 canonical patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fold-0.1.0.yml

permissions:
  contents: write

jobs:
  fold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Reconstruct corrected candidate and generate canonical patch
        shell: bash
        run: |
          set -euo pipefail
          . ./UPSTREAM

          rm -rf .fold
          mkdir -p .fold

          if ! git clone --filter=blob:none "$LIBINPUT_REPO" .fold/libinput; then
            echo "primary upstream transport failed; using read-only Chromium mirror"
            git clone --filter=blob:none \
              https://chromium.googlesource.com/external/gitlab.freedesktop.org/libinput/libinput \
              .fold/libinput
          fi

          if ! git -C .fold/libinput cat-file -e "$LIBINPUT_COMMIT^{commit}" 2>/dev/null; then
            git -C .fold/libinput fetch origin "$LIBINPUT_COMMIT"
          fi
          git -C .fold/libinput checkout --detach "$LIBINPUT_COMMIT"
          test "$(git -C .fold/libinput rev-parse HEAD)" = "$LIBINPUT_COMMIT"

          gzip -dc patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0.patch.gz \
            > .fold/base.patch
          git -C .fold/libinput apply --check ../base.patch
          git -C .fold/libinput apply ../base.patch

          git -C .fold/libinput apply --check \
            ../../patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0-meson-fix.patch
          git -C .fold/libinput apply \
            ../../patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0-meson-fix.patch

          python3 tools/fix-0.1.0-usec-boundary.py .fold/libinput
          git -C .fold/libinput diff --check

          expected=$'meson.build\nsrc/evdev-fallback.c\nsrc/evdev.c\nsrc/evdev.h'
          actual="$(git -C .fold/libinput diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "unexpected canonical patch file set:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          out=patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0.patch
          git -C .fold/libinput diff --binary --no-ext-diff --no-renames \
            --src-prefix=a/ --dst-prefix=b/ > "$GITHUB_WORKSPACE/$out"
          sha256sum "$out" > "$out.sha256"

          # Re-prove the generated artifact against a pristine pinned tree.
          git -C .fold/libinput reset --hard "$LIBINPUT_COMMIT"
          git -C .fold/libinput clean -fdx
          git -C .fold/libinput apply --check "$GITHUB_WORKSPACE/$out"
          git -C .fold/libinput apply "$GITHUB_WORKSPACE/$out"
          git -C .fold/libinput diff --check

          verify=.fold/verify.patch
          git -C .fold/libinput diff --binary --no-ext-diff --no-renames \
            --src-prefix=a/ --dst-prefix=b/ > "$verify"
          cmp "$out" "$verify"

          echo "canonical patch SHA-256:"
          cat "$out.sha256"
          git -C .fold/libinput diff --stat

      - name: Commit generated canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0.patch \
            patches/libinput-1.31.0-trackpoint-scroll-core-v0.1.0.patch.sha256
          git diff --cached --check
          git commit -m 'Generate folded 0.1.0 canonical patch'
          git push
