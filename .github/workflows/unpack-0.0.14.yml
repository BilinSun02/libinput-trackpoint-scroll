name: Unpack 0.0.14 baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-0.0.14.yml'
      - 'releases/0.0.14/libinput-trackpoint-scroll-v14-documented-bundle.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack exact historical bundle
        run: |
          set -eux
          cd releases/0.0.14
          echo 'e00f729a3bb2c225760901ec286cd0b35871d8bbae284222018618a27e88f831  libinput-trackpoint-scroll-v14-documented-bundle.zip' | sha256sum -c -
          rm -rf files
          mkdir files
          unzip -q libinput-trackpoint-scroll-v14-documented-bundle.zip -d files
          cd files
          sha256sum -c libinput-trackpoint-scroll-v14-SHA256SUMS
      - name: Commit browsable historical files
        run: |
          set -eux
          if git diff --quiet -- releases/0.0.14/files && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add releases/0.0.14/files
          git commit -m 'Expose 0.0.14 historical bundle contents'
          git push
